# Example AdaptivePy configuration (feature-only run)

features_dir: examples/data/features
output_dir: examples/results

clustering:
  method: kmeans
  n_clusters: 5
  params: {}

policies:
  - least_counts
  - random
  # - fast

# Example FAST policy settings (uncomment with policies: [fast])
# policy_params:
#   fast:
#     feature_indices: [0]
#     directions: [maximize]
#     alpha: 1.0

# Example MA-REAP policy settings (uncomment with policies: [ma_reap])
# policy_params:
#   ma_reap:
#     n_candidates: 6
#     agents:
#       agent_0: [traj_0]
#       agent_1: [traj_1]
#     delta: 0.05
#     regime: collaborative

n_seeds: 3

seed_selection:
  method: nearest_center

random_seed: 42
write_pdbs: false
