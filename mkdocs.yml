site_name: AdaptivePy
site_description: Adaptive sampling for molecular dynamics trajectories
site_url: https://shuklagroup.github.io/AdaptivePy/
repo_url: https://github.com/shuklagroup/AdaptivePy
repo_name: shuklagroup/AdaptivePy
edit_uri: edit/main/doc_src/
docs_dir: doc_src
site_dir: docs

theme:
  name: material
  language: en
  favicon: assets/uiuc-block-i.svg
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.sections
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow

extra_css:
  - stylesheets/uiuc.css

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            merge_init_into_class: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Configuration: configuration.md
  - Feature Inputs: features.md
  - CLI: cli.md
  - Python API: python-api.md
  - Policies: policies.md
  - Outputs: outputs.md
  - API Reference:
      - Public API: reference/api.md
      - Configuration: reference/config.md
      - I/O: reference/io.md
      - Clustering: reference/clustering.md
      - Policies: reference/policies.md
      - Selection: reference/selection.md
      - Statistics: reference/stats.md
      - Output: reference/output.md
  - Development: development.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/shuklagroup/AdaptivePy
