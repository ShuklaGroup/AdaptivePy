[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptivepy"
version = "0.1.0"
description = "Adaptive sampling on MD trajectories via clustering and policy-driven seed selection"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "AdaptivePy Contributors" }]
dependencies = [
    "numpy>=1.20",
    "scikit-learn>=1.0",
    "pyyaml>=6.0",
    "click>=8.0",
    "joblib>=1.0",
    "mdtraj>=1.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
adaptivepy = "adaptivepy.cli.run:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["adaptivepy*"]
